<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>{% block title %}{{ cfg.get('gallery_title','NativeFrames Gallery') }}{% endblock %}</title>
  <meta name="description" content="{{ cfg.get('gallery_subtitle','Every frame tells a story.') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='images/nativeframes-logo.jpg') }}" type="image/jpeg" />
  {% block head %}{% endblock %}
</head>
<body>

<!-- ===================== GALLERY TOPBAR ===================== -->
<header class="gallery-topbar">
  <div class="gallery-topbar-inner">
    <a class="gallery-logo" href="{{ url_for('gallery.index') }}" aria-label="NativeFrames Home">
      <img src="{{ url_for('static', filename='images/nativeframes-logo.jpg') }}" alt="NativeFrames" />
    </a>

    <div class="gallery-welcome">
      Welcome, <span>{{ viewer_name }}</span>
    </div>

    <form id="gallery-search-form" method="GET" action="{{ url_for('gallery.index') }}" class="gallery-search-wrap">
      <span class="gallery-search-icon">🔍</span>
      <input id="gallery-search-input" class="gallery-search" type="search"
             name="q" value="{{ request.args.get('q','') }}"
             placeholder="Search media…" autocomplete="off" />
    </form>

    <div class="gallery-tabs">
      <a href="{{ url_for('gallery.index', tab='all') }}"    class="gallery-tab {% if tab == 'all' %}active{% endif %}">All</a>
      <a href="{{ url_for('gallery.index', tab='photos') }}" class="gallery-tab {% if tab == 'photos' %}active{% endif %}">Photos</a>
      <a href="{{ url_for('gallery.index', tab='videos') }}" class="gallery-tab {% if tab == 'videos' %}active{% endif %}">Videos</a>
      <a href="{{ url_for('gallery.index', tab='audio') }}"  class="gallery-tab {% if tab == 'audio' %}active{% endif %}">Music</a>
      {% if cfg.get('allow_favourites','1') == '1' %}
      <a href="{{ url_for('gallery.index', tab='favourites') }}" class="gallery-tab {% if tab == 'favourites' %}active{% endif %}">★ Favs</a>
      {% endif %}
    </div>

    <a href="{{ url_for('auth.viewer_logout') }}" class="btn btn-ghost btn-sm" style="white-space:nowrap">
      Exit
    </a>
  </div>
</header>
<!-- ===================== /GALLERY TOPBAR ===================== -->

<main style="min-height:calc(100vh - 70px); padding-bottom: 80px;">
  {% block content %}{% endblock %}
</main>

<!-- ===================== MINI AUDIO PLAYER ===================== -->
<div class="mini-player" id="mini-player">
  <img class="mini-player-thumb" id="mini-player-thumb" src="" alt="" style="display:none;" />
  <div class="mini-player-info">
    <div class="mini-player-title">—</div>
    <div class="mini-player-artist"></div>
  </div>
  <div class="mini-player-controls">
    <button class="mini-player-btn play-pause" aria-label="Play/Pause">▶</button>
  </div>
  <div class="mini-player-progress">
    <span class="player-time current-time">0:00</span>
    <input class="player-seek" type="range" min="0" max="100" value="0" aria-label="Seek" />
    <span class="player-time total-time">0:00</span>
  </div>
  <button class="mini-player-btn mini-player-close" aria-label="Close player">✕</button>
  <audio id="mini-audio" preload="none"></audio>
</div>
<!-- ===================== /MINI AUDIO PLAYER ===================== -->

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
